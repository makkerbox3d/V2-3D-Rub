<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MakkerBox 3D OS</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">



<aside class="sidebar">


<div class="brand">


<img 
id="logoEmpresa"
src="assets/logo/logo.png"
onerror="this.style.display='none'">


<h2 id="nomeEmpresa">
MakkerBox 3D OS
</h2>


<p>
Gestão Maker
</p>


</div>




<nav>


<button onclick="mostrarTela('dashboard')">
🏠 Dashboard
</button>



<button onclick="mostrarTela('projetos')">
🧊 Projetos 3D
</button>



<button onclick="mostrarTela('impressoras')">
🖨 Impressoras
</button>



<button onclick="mostrarTela('estoque')">
📦 Estoque
</button>



<button onclick="mostrarTela('pintura')">
🎨 Pintura
</button>



<button onclick="mostrarTela('financeiro')">
💰 Financeiro
</button>



<button onclick="mostrarTela('clientes')">
👥 Clientes
</button>



<button onclick="mostrarTela('config')">
⚙ Configuração
</button>



</nav>



</aside>





<main class="content">



<!-- DASHBOARD -->


<section id="dashboard" class="tela">


<h1>
Dashboard
</h1>



<div class="cards">



<div class="card">

<h3>
🖨 Impressoras
</h3>

<strong id="totalImpressoras">
0
</strong>

</div>



<div class="card">

<h3>
📦 Itens estoque
</h3>

<strong id="totalEstoque">
0
</strong>

</div>



<div class="card">

<h3>
🧊 Projetos
</h3>

<strong>
0
</strong>

</div>



<div class="card">

<h3>
💰 Lucro
</h3>

<strong>
R$ 0
</strong>

</div>


</div>



</section>





<!-- IMPRESSORAS -->


<section id="impressoras" class="tela escondida">


<h1>
🖨 Impressoras 3D
</h1>


<div class="form">


<input id="marca"
placeholder="Marca">


<input id="modelo"
placeholder="Modelo">



<select id="tipo">


<option>
FDM
</option>


<option>
SLA
</option>


<option>
MSLA
</option>


<option>
SLS
</option>


</select>



<input id="valor"
type="number"
placeholder="Valor da impressora">



<input id="potencia"
type="number"
placeholder="Potência Watts">



<input id="kwh"
type="number"
placeholder="Valor kWh">



<input id="horas"
type="number"
placeholder="Horas trabalhadas">



<button onclick="adicionarImpressora()">

Cadastrar Impressora

</button>



</div>



<div id="listaImpressoras">

</div>



</section>





<!-- ESTOQUE -->


<section id="estoque" class="tela escondida">


<h1>
📦 Almoxarifado Maker
</h1>



<div class="form">



<input
id="produtoNome"
placeholder="Nome do produto">



<select id="categoria">


<option>
Resina
</option>


<option>
Filamento
</option>


<option>
Tinta
</option>


<option>
Consumível
</option>


<option>
Ferramenta
</option>



</select>



<input
id="quantidade"
type="number"
placeholder="Quantidade">


<select id="unidade">


<option>
ml
</option>


<option>
g
</option>


<option>
kg
</option>


<option>
unidade
</option>


</select>



<input
id="valorProduto"
type="number"
placeholder="Valor pago">



<input
id="estoqueMinimo"
type="number"
placeholder="Estoque mínimo">



<button onclick="adicionarEstoque()">

Cadastrar Material

</button>



</div>



<div id="listaEstoque">

</div>



</section>
